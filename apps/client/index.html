<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearthfall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <header id="top">
      <div class="brand">Hearthfall</div>
      <div id="stats"></div>
    </header>
    <aside id="roster" aria-label="Survivors"></aside>
    <nav id="toolbar" aria-label="Orders">
      <div class="group">
        <button data-tool="dig" class="active"><kbd>1</kbd>Dig</button>
        <button data-tool="ladder"><kbd>2</kbd>Ladder</button>
        <button data-tool="hearth" title="Costs 8 coal"><kbd>3</kbd>Hearth</button>
        <button data-tool="mushroom" title="Grows food, but only in the dark"><kbd>4</kbd>Mushrooms</button>
        <button data-tool="diffuser"><kbd>5</kbd>Oxygen</button>
        <button data-tool="cancel"><kbd>X</kbd>Cancel</button>
      </div>
      <div class="group">
        <button data-overlay="none" class="active">View</button>
        <button data-overlay="oxygen"><kbd>O</kbd>O₂</button>
        <button data-overlay="co2"><kbd>C</kbd>CO₂</button>
        <button data-overlay="temperature"><kbd>T</kbd>Heat</button>
      </div>
    </nav>
    <p id="hint">Click to mark orders and your survivors will carry them out. Shift-drag marks many cells. Dig the black coal seams for fuel. Drag to pan, scroll to zoom.</p>
    <div id="banner" hidden>The last fire has gone out.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
